<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HalloweenGame.gni 🎃</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;700;800;900&display=swap');

  :root{
    --night-top:#160a28;
    --night-bottom:#05030c;
    --pumpkin:#ff7a1a;
    --pumpkin-dark:#c8500a;
    --moon:#fff1cf;
    --ghost:#e9e4f4;
    --candy:#8ee34d;
    --panel:#180d28;
    --gold:#ffd76a;
    --gold-dark:#7a5a10;
    --silver:#d9dee6;
    --silver-dark:#5a5f66;
    --bronze:#e0a06a;
    --bronze-dark:#6b3d16;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--night-bottom);
    font-family:'Nunito', sans-serif;
    touch-action:none;
  }

  #stage{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  canvas{ display:block; position:absolute; top:0; left:0; }

  .hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:18px 22px; pointer-events:none; z-index:5;
  }
  .score{
    font-weight:900; font-size:28px; color:var(--pumpkin);
    text-shadow:0 0 12px rgba(255,122,26,0.6), 0 2px 0 rgba(0,0,0,0.5);
  }
  .lives{ display:flex; gap:6px; }
  .life{ font-size:22px; filter:drop-shadow(0 0 6px rgba(255,122,26,0.6)); }

  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    background:radial-gradient(ellipse at center, rgba(22,10,40,0.9) 0%, rgba(5,3,12,0.98) 75%);
    z-index:10; text-align:center; padding:20px;
    overflow-y:auto;
  }
  .hidden{ display:none !important; }

  h1.title{
    font-family:'Creepster', cursive; font-weight:400;
    font-size:clamp(34px, 9vw, 62px);
    color:var(--pumpkin); margin:4px 0 2px 0;
    text-shadow:0 0 22px rgba(255,122,26,0.7), 0 0 4px rgba(255,200,120,0.6);
    letter-spacing:2px;
  }

  .subtitle{
    color:var(--ghost); font-size:14px; opacity:0.8;
    margin:0 0 14px 0; max-width:340px; line-height:1.45;
  }

  .identity-row{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:999px;
    padding:8px 8px 8px 16px;
    margin-bottom:16px;
    font-size:13px; color:var(--ghost);
  }
  .identity-name{ font-weight:800; color:var(--pumpkin); }
  .name-btn{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:12px;
    color:#1a0b2e; background:var(--ghost); border:none;
    padding:7px 14px; border-radius:999px; cursor:pointer;
  }

  .tabs{ display:flex; gap:8px; margin-bottom:10px; }
  .tab-btn{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:13px;
    color:var(--ghost); background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    padding:9px 16px; border-radius:999px; cursor:pointer;
    opacity:0.65;
  }
  .tab-btn.active{
    opacity:1; color:#1a0b2e; background:var(--pumpkin); border-color:var(--pumpkin);
  }

  .board-wrap{
    width:100%; max-width:360px;
    background:var(--panel);
    border:1px solid rgba(255,122,26,0.18);
    border-radius:18px;
    padding:10px;
    margin-bottom:16px;
    max-height:34vh;
    overflow-y:auto;
  }
  .board-empty{ color:var(--ghost); opacity:0.5; font-size:13px; padding:18px 6px; }

  .board-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 8px;
    border-radius:12px;
  }
  .board-row + .board-row{ margin-top:2px; }
  .rank{
    width:26px; text-align:center; font-weight:900; font-size:13px;
    color:var(--ghost); opacity:0.7; flex-shrink:0;
  }
  .name-pill{
    flex:1; text-align:left; font-weight:800; font-size:13px;
    color:var(--ghost);
    padding:4px 10px; border-radius:999px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row-score{ font-weight:900; font-size:14px; color:var(--pumpkin); flex-shrink:0; }
  .row-plays{ font-size:10px; opacity:0.55; color:var(--ghost); flex-shrink:0; min-width:44px; }

  .rank-1 .name-pill{ background:linear-gradient(90deg, var(--gold-dark), var(--gold)); color:#3a2a05; }
  .rank-2 .name-pill{ background:linear-gradient(90deg, var(--silver-dark), var(--silver)); color:#25282c; }
  .rank-3 .name-pill{ background:linear-gradient(90deg, var(--bronze-dark), var(--bronze)); color:#3a2005; }
  .rank-1 .rank, .rank-2 .rank, .rank-3 .rank{ opacity:1; }

  button.play-btn{
    font-family:'Nunito', sans-serif; font-weight:900; font-size:19px;
    color:#1a0b2e; background:linear-gradient(180deg, #ffb454, var(--pumpkin));
    border:none; padding:15px 42px; border-radius:999px; cursor:pointer;
    box-shadow:0 6px 0 var(--pumpkin-dark), 0 8px 24px rgba(255,122,26,0.4);
    transition:transform 0.08s ease;
  }
  button.play-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--pumpkin-dark); }

  .final-score{ font-size:48px; font-weight:900; color:var(--pumpkin); text-shadow:0 0 18px rgba(255,122,26,0.6); margin:2px 0; }
  .best-score{ color:var(--ghost); opacity:0.8; font-size:13px; margin-bottom:18px; }

  .hint{
    position:absolute; bottom:16px; left:0; right:0; text-align:center;
    color:var(--ghost); opacity:0.4; font-size:11px; z-index:5; pointer-events:none;
  }

  /* Name modal */
  .modal{
    position:absolute; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,3,12,0.85);
    padding:20px;
  }
  .modal-card{
    background:var(--panel); border:1px solid rgba(255,122,26,0.25);
    border-radius:18px; padding:22px; width:100%; max-width:300px;
    text-align:center;
  }
  .modal-card p{ color:var(--ghost); font-size:13px; opacity:0.75; margin:0 0 14px 0; }
  .modal-card input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06); color:var(--ghost); font-size:15px; font-family:'Nunito',sans-serif;
    margin-bottom:14px; outline:none;
  }
  .modal-card input:focus{ border-color:var(--pumpkin); }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{
    flex:1; font-family:'Nunito', sans-serif; font-weight:800; font-size:13px;
    border:none; padding:11px; border-radius:12px; cursor:pointer;
  }
  .modal-save{ background:var(--pumpkin); color:#1a0b2e; }
  .modal-cancel{ background:rgba(255,255,255,0.08); color:var(--ghost); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="score" id="scoreDisplay">0</div>
    <div class="lives" id="livesDisplay"></div>
  </div>

  <div class="overlay" id="startScreen">
    <h1 class="title">Улови тиквите!</h1>
    <p class="subtitle">Движи котела, събирай 🎃 и 🍬, пази се от 💀. Мишка / пръст / ← →</p>

    <div class="identity-row">
      <span>Играеш като <span class="identity-name" id="identityName">...</span></span>
      <button class="name-btn" id="nameBtn">Задай име</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabGlobal">🏆 Обща класация</button>
      <button class="tab-btn" id="tabMine">📜 Моите опити</button>
    </div>

    <div class="board-wrap" id="boardGlobal"><div class="board-empty">Зареждане...</div></div>
    <div class="board-wrap hidden" id="boardMine"><div class="board-empty">Зареждане...</div></div>

    <button class="play-btn" id="startBtn">Играй</button>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <h1 class="title" style="font-size:clamp(26px,7vw,40px)">Край на играта</h1>
    <div class="final-score" id="finalScore">0</div>
    <div class="best-score" id="bestScoreLine"></div>
    <div style="display:flex; gap:10px;">
      <button class="play-btn" id="retryBtn">Пак!</button>
      <button class="play-btn" id="menuBtn" style="background:linear-gradient(180deg, #efe9f7, var(--ghost)); box-shadow:0 6px 0 #9a92ab, 0 8px 24px rgba(0,0,0,0.3);">Меню</button>
    </div>
  </div>

  <div class="modal hidden" id="nameModal">
    <div class="modal-card">
      <p>Въведи име, с което да се показваш в класацията:</p>
      <input type="text" id="nameInput" maxlength="16" placeholder="напр. Иван">
      <div class="modal-actions">
        <button class="modal-cancel" id="nameCancel">Отказ</button>
        <button class="modal-save" id="nameSave">Запази</button>
      </div>
    </div>
  </div>

  <div class="hint hidden" id="playHint">← → или влачи с пръст</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ================= PROFILE & LEADERBOARD STORAGE =================
  let profile = { id: String(Math.floor(1000 + Math.random()*9000)), name: null };
  let myAttempts = [];
  let globalBoard = {}; // id -> {id,name,bestScore,timesPlayed}
  let storageReady = false;
  const FIREBASE_DB_URL = 'https://halloweengameqni-d83e6-default-rtdb.firebaseio.com';

  function displayName(p){
    return (p && p.name && p.name.trim()) ? p.name.trim() : ('Player#' + p.id);
  }

  // Local persistence for this device's identity + personal history.
  function lsGet(key){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function lsSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  async function initStorage(){
    const savedProfile = lsGet('ulovi_profile');
    if(savedProfile){
      profile = savedProfile;
    } else {
      lsSet('ulovi_profile', profile);
    }

    myAttempts = lsGet('ulovi_attempts') || [];

    await refreshGlobalBoard();
    storageReady = true;
    renderIdentity();
  }

  async function refreshGlobalBoard(){
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/leaderboard.json`);
      const data = await res.json();
      globalBoard = data || {};
    }catch(e){ /* keep whatever we had */ }
    renderBoards();
  }

  async function saveProfile(){
    lsSet('ulovi_profile', profile);
  }

  async function saveAttempts(){
    lsSet('ulovi_attempts', myAttempts);
  }

  async function recordResult(finalScore){
    myAttempts.push({ score: finalScore, ts: Date.now() });
    if(myAttempts.length > 200) myAttempts = myAttempts.slice(-200);
    saveAttempts();

    try{
      const res = await fetch(`${FIREBASE_DB_URL}/leaderboard/${profile.id}.json`);
      const existing = await res.json();
      const entry = existing || { id: profile.id, name: profile.name, bestScore: 0, timesPlayed: 0 };
      entry.name = profile.name;
      entry.timesPlayed = (entry.timesPlayed || 0) + 1;
      entry.bestScore = Math.max(entry.bestScore || 0, finalScore);
      await fetch(`${FIREBASE_DB_URL}/leaderboard/${profile.id}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry)
      });
      globalBoard[profile.id] = entry;
    }catch(e){ /* offline: local attempt still saved above */ }
    renderBoards();
  }

  function renderIdentity(){
    document.getElementById('identityName').textContent = displayName(profile);
  }

  function medalClass(i){
    if(i===0) return 'rank-1';
    if(i===1) return 'rank-2';
    if(i===2) return 'rank-3';
    return '';
  }

  function renderBoards(){
    // Global: best score per player, descending
    const globalArr = Object.values(globalBoard).sort((a,b)=> (b.bestScore||0) - (a.bestScore||0));
    const gWrap = document.getElementById('boardGlobal');
    if(globalArr.length===0){
      gWrap.innerHTML = '<div class="board-empty">Все още никой не е играл. Бъди първи! 🎃</div>';
    } else {
      gWrap.innerHTML = globalArr.map((e,i)=>{
        const nm = (e.name && e.name.trim()) ? e.name.trim() : ('Player#'+e.id);
        return `<div class="board-row ${medalClass(i)}">
          <div class="rank">${i+1}</div>
          <div class="name-pill">${escapeHtml(nm)}</div>
          <div class="row-plays">${e.timesPlayed||1}x</div>
          <div class="row-score">${e.bestScore}</div>
        </div>`;
      }).join('');
    }

    // Mine: all my attempts, best first
    const mineArr = myAttempts.slice().sort((a,b)=> b.score - a.score);
    const mWrap = document.getElementById('boardMine');
    if(mineArr.length===0){
      mWrap.innerHTML = '<div class="board-empty">Все още нямаш опити. Играй! 🎃</div>';
    } else {
      mWrap.innerHTML = mineArr.map((a,i)=>{
        return `<div class="board-row ${medalClass(i)}">
          <div class="rank">${i+1}</div>
          <div class="name-pill">Опит</div>
          <div class="row-score">${a.score}</div>
        </div>`;
      }).join('');
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Tabs
  const tabGlobal = document.getElementById('tabGlobal');
  const tabMine = document.getElementById('tabMine');
  const boardGlobal = document.getElementById('boardGlobal');
  const boardMine = document.getElementById('boardMine');
  tabGlobal.addEventListener('click', ()=>{
    tabGlobal.classList.add('active'); tabMine.classList.remove('active');
    boardGlobal.classList.remove('hidden'); boardMine.classList.add('hidden');
    refreshGlobalBoard();
  });
  tabMine.addEventListener('click', ()=>{
    tabMine.classList.add('active'); tabGlobal.classList.remove('active');
    boardMine.classList.remove('hidden'); boardGlobal.classList.add('hidden');
  });

  // Name modal
  const nameModal = document.getElementById('nameModal');
  const nameInput = document.getElementById('nameInput');
  document.getElementById('nameBtn').addEventListener('click', ()=>{
    nameInput.value = profile.name || '';
    nameModal.classList.remove('hidden');
    nameInput.focus();
  });
  document.getElementById('nameCancel').addEventListener('click', ()=>{
    nameModal.classList.add('hidden');
  });
  document.getElementById('nameSave').addEventListener('click', async ()=>{
    const v = nameInput.value.trim().slice(0,16);
    profile.name = v.length ? v : null;
    await saveProfile();
    renderIdentity();
    // reflect new name on existing global entry immediately
    if(globalBoard[profile.id]){
      globalBoard[profile.id].name = profile.name;
      try{
        await fetch(`${FIREBASE_DB_URL}/leaderboard/${profile.id}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: profile.name })
        });
      }catch(e){}
    }
    renderBoards();
    nameModal.classList.add('hidden');
  });

  // ================= BACKGROUND DECOR =================
  const stars = [];
  for(let i=0;i<80;i++){
    stars.push({ x: Math.random(), y: Math.random()*0.6, r: Math.random()*1.6+0.4, tw: Math.random()*Math.PI*2 });
  }
  const bat = { x:-0.2, y:0.15, speed:0.00018, wing:0 };

  function drawBackground(t){
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1c0c33'); grad.addColorStop(0.55,'#12081f'); grad.addColorStop(1,'#05030c');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

    const mx = W*0.82, my = H*0.16, mr = Math.min(W,H)*0.07;
    ctx.save(); ctx.shadowColor = 'rgba(255,241,207,0.55)'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#fff1cf'; ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(200,180,150,0.25)';
    ctx.beginPath(); ctx.arc(mx-mr*0.3,my-mr*0.2,mr*0.18,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+mr*0.25,my+mr*0.3,mr*0.12,0,Math.PI*2); ctx.fill();

    stars.forEach(s=>{
      const alpha = 0.4 + 0.6*Math.abs(Math.sin(t*0.001+s.tw));
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill();
    });

    bat.x += bat.speed * 16;
    if(bat.x > 1.3) bat.x = -0.3;
    bat.wing = Math.sin(t*0.012);
    const bx = bat.x*W, by = bat.y*H + Math.sin(t*0.003)*14;
    ctx.save(); ctx.translate(bx,by); ctx.fillStyle = 'rgba(10,5,18,0.8)';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-14, -10*Math.abs(bat.wing)-4, -22, 2);
    ctx.quadraticCurveTo(-10, 2, 0, 6);
    ctx.quadraticCurveTo(10, 2, 22, 2);
    ctx.quadraticCurveTo(14, -10*Math.abs(bat.wing)-4, 0, 0);
    ctx.fill(); ctx.restore();

    ctx.fillStyle = '#0a0512';
    ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H*0.86);
    for(let x=0;x<=W;x+=40){ const y = H*0.86 + Math.sin(x*0.006+1.2)*10; ctx.lineTo(x,y); }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }

  // ================= PLAYER =================
  const player = { x:0.5, w:76, h:54, targetX:0.5 };

  function drawPlayer(){
    const px = player.x*W, py = H - 70;
    ctx.save(); ctx.translate(px,py);
    ctx.shadowColor='rgba(255,122,26,0.45)'; ctx.shadowBlur=18;
    ctx.fillStyle = '#1b1420';
    ctx.beginPath();
    ctx.moveTo(-player.w/2, 0);
    ctx.quadraticCurveTo(0, player.h*0.9, player.w/2, 0);
    ctx.quadraticCurveTo(player.w/2-6, -8, player.w/2-14, -10);
    ctx.lineTo(-player.w/2+14, -10);
    ctx.quadraticCurveTo(-player.w/2+6, -8, -player.w/2, 0);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0,-10, player.w/2-10, 7, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle='#1b1420';
    ctx.fillRect(-player.w/2+4, player.h*0.55, 8, 10);
    ctx.fillRect(player.w/2-12, player.h*0.55, 8, 10);
    ctx.restore();
  }

  // ================= ITEMS =================
  let items = [];
  let spawnTimer = 0, spawnInterval = 950, fallSpeedBase = 1.9;

  function spawnItem(){
    const roll = Math.random();
    let type = roll < 0.62 ? 'pumpkin' : (roll < 0.82 ? 'candy' : 'skull');
    items.push({
      x: 0.08 + Math.random()*0.84, y: -0.05, type,
      speed: fallSpeedBase + Math.random()*0.8,
      rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.05,
      size: type==='candy' ? 26 : 34
    });
  }
  function emojiFor(type){ return type==='pumpkin' ? '🎃' : (type==='candy' ? '🍬' : '💀'); }

  function drawItems(){
    items.forEach(it=>{
      ctx.save(); ctx.translate(it.x*W, it.y*H); ctx.rotate(it.rot);
      ctx.font = `${it.size}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      if(it.type==='candy'){ ctx.shadowColor='rgba(142,227,77,0.7)'; ctx.shadowBlur=14; }
      else if(it.type==='skull'){ ctx.shadowColor='rgba(255,255,255,0.35)'; ctx.shadowBlur=8; }
      ctx.fillText(emojiFor(it.type), 0, 0);
      ctx.restore();
    });
  }

  let particles = [];
  function burst(x,y,color){
    for(let i=0;i<10;i++){
      particles.push({ x, y, vx:(Math.random()-0.5)*3.5, vy:(Math.random()-1.6)*3.5, life:1, color });
    }
  }
  function drawParticles(dt){
    particles.forEach(p=>{ p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= dt*0.0022; });
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.life,0); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    });
  }

  // ================= GAME STATE =================
  let score = 0, lives = 3, running = false, lastTime = 0, shake = 0;

  const scoreDisplay = document.getElementById('scoreDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreLine = document.getElementById('bestScoreLine');
  const playHint = document.getElementById('playHint');

  function renderLives(){
    livesDisplay.innerHTML = '';
    for(let i=0;i<3;i++){
      const span = document.createElement('span');
      span.className='life';
      span.textContent = i < lives ? '🎃' : '🕸️';
      span.style.opacity = i < lives ? '1' : '0.35';
      livesDisplay.appendChild(span);
    }
  }
  function updateScore(v){ score += v; scoreDisplay.textContent = score; }

  function startGame(){
    score = 0; lives = 3; items = []; particles = [];
    spawnInterval = 950; fallSpeedBase = 1.9; spawnTimer = 0;
    scoreDisplay.textContent = '0';
    renderLives();
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    playHint.classList.remove('hidden');
    running = true; lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    const myBest = myAttempts.length ? Math.max(...myAttempts.map(a=>a.score), score) : score;
    finalScoreEl.textContent = score;
    recordResult(score).then(()=>{
      const newBest = Math.max(...myAttempts.map(a=>a.score));
      bestScoreLine.textContent = 'Твой рекорд: ' + newBest;
    });
    gameOverScreen.classList.remove('hidden');
    playHint.classList.add('hidden');
  }

  function loop(now){
    if(!running) return;
    const dt = Math.min(now - lastTime, 40);
    lastTime = now;

    player.x += (player.targetX - player.x) * 0.22;
    player.x = Math.max(0.06, Math.min(0.94, player.x));

    spawnTimer += dt;
    if(spawnTimer > spawnInterval){
      spawnTimer = 0; spawnItem();
      spawnInterval = Math.max(480, spawnInterval - 4);
      fallSpeedBase = Math.min(4.0, fallSpeedBase + 0.011);
    }

    const catchY = H - 78;
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      it.y += it.speed*dt*0.00034;
      it.rot += it.rotSpeed;
      const iy = it.y*H, ix = it.x*W;

      if(iy > catchY - 20 && iy < catchY + 26){
        const dx = Math.abs(ix - player.x*W);
        if(dx < player.w/2){
          if(it.type==='pumpkin'){ updateScore(10); burst(ix,iy,'#ff7a1a'); }
          else if(it.type==='candy'){ updateScore(25); burst(ix,iy,'#8ee34d'); }
          else{
            lives -= 1; renderLives(); shake = 12; burst(ix,iy,'#e9e4f4');
            if(lives<=0){ items.splice(i,1); endGame(); continue; }
          }
          items.splice(i,1); continue;
        }
      }
      if(it.y > 1.08) items.splice(i,1);
    }

    ctx.save();
    if(shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
      shake *= 0.85; if(shake<0.5) shake=0;
    }
    drawBackground(now); drawItems(); drawPlayer(); drawParticles(dt);
    ctx.restore();

    requestAnimationFrame(loop);
  }

  // ================= CONTROLS =================
  function setTargetFromClientX(clientX){
    const rect = canvas.getBoundingClientRect();
    player.targetX = (clientX - rect.left) / rect.width;
  }
  canvas.addEventListener('mousemove', e => setTargetFromClientX(e.clientX));
  canvas.addEventListener('touchmove', e => { e.preventDefault(); setTargetFromClientX(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('touchstart', e => { setTargetFromClientX(e.touches[0].clientX); }, {passive:false});

  const keys = {};
  window.addEventListener('keydown', e=>{ keys[e.key]=true; });
  window.addEventListener('keyup', e=>{ keys[e.key]=false; });
  function keyLoop(){
    if(keys['ArrowLeft'] || keys['a']) player.targetX -= 0.018;
    if(keys['ArrowRight'] || keys['d']) player.targetX += 0.018;
    player.targetX = Math.max(0.06, Math.min(0.94, player.targetX));
    requestAnimationFrame(keyLoop);
  }
  keyLoop();

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('menuBtn').addEventListener('click', ()=>{
    gameOverScreen.classList.add('hidden');
    refreshGlobalBoard();
    startScreen.classList.remove('hidden');
  });

  function idleLoop(now){
    if(!running){
      ctx.save(); drawBackground(now); drawPlayer(); ctx.restore();
      requestAnimationFrame(idleLoop);
    }
  }
  requestAnimationFrame(idleLoop);

  initStorage();
})();
</script>
</body>
</html>
